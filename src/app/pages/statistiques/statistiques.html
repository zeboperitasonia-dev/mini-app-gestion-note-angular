<div class="min-h-screen bg-gray-50 p-8">

  <h2 class="text-2xl font-bold text-blue-900 mb-8">
     Statistiques
  </h2>

  <div class="grid grid-cols-2 gap-6 max-w-2xl">

    <!-- Total étudiants -->
    <div class="bg-blue-100 border-2 border-blue-400 
                rounded-xl p-6 text-center shadow">
      <p class="text-4xl font-bold text-blue-800">
        {{ etudiantsSignal().length }}
      </p>
      <p class="text-blue-600 font-semibold mt-2">
         Total étudiants
      </p>
    </div>

    <!-- Moyenne générale -->
    <div class="bg-purple-100 border-2 border-purple-400 
                rounded-xl p-6 text-center shadow">
      <p class="text-4xl font-bold text-purple-800">
        {{ moyenneGenerale() | number:'1.2-2' }}
      </p>
      <p class="text-purple-600 font-semibold mt-2">
         Moyenne générale /20
      </p>
    </div>

    <!-- Réussites -->
    <div class="bg-green-100 border-2 border-green-400 
                rounded-xl p-6 text-center shadow">
      <p class="text-4xl font-bold text-green-800">
        {{ nombreReussites() }}
      </p>
      <p class="text-green-600 font-semibold mt-2">
         Réussites
      </p>
    </div>

    <!-- Échecs -->
    <div class="bg-red-100 border-2 border-red-400 
                rounded-xl p-6 text-center shadow">
      <p class="text-4xl font-bold text-red-800">
        {{ nombreEchecs() }}
      </p>
      <p class="text-red-600 font-semibold mt-2">
         Échecs
      </p>
    </div>

  </div>
</div>
