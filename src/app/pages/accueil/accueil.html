<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4">
  <div class="bg-white rounded-2xl shadow-lg p-8 md:p-12 text-center 
              w-full max-w-lg border-2 border-dashed border-black">
    
    <h1 class="text-2xl md:text-3xl font-bold text-blue-900 mb-4">
       Bienvenue dans l'application de gestion de notes
    </h1>

    <p class="text-gray-500 mb-2 text-base md:text-lg">
      Professeur : 
      <span class="font-semibold text-blue-700">{{ nomProfesseur }}</span>
    </p>

    <p class="text-gray-500 mb-8 text-base md:text-lg">
      Nombre d'étudiants : 
      <span class="font-semibold text-blue-700">{{ nombreEtudiants() }}</span>
    </p>

    <button 
      (click)="allerVersNotes()"
      class="w-full md:w-auto bg-blue-900 text-white px-8 py-3 rounded-xl 
             hover:bg-blue-700 transition-all font-semibold text-base md:text-lg">
      📋 Voir les notes
    </button>

  </div>
</div>
